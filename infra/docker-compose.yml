services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: pedidos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: aula
      RABBITMQ_DEFAULT_PASS: aula-local # credencial didática, apenas para ambiente local
    ports:
      - "127.0.0.1:5672:5672"   # AMQP (mensagens das aplicações)
      - "127.0.0.1:15672:15672" # painel de gerenciamento (HTTP)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
